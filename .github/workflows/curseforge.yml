# Uploads the addon to CurseForge when a release is published on GitHub.
# Running it by hand (Actions tab > CurseForge > Run workflow) only builds the zip, to check it.
name: CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads the tags for the version

      - name: Check the TOC version matches the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' addon/Cassette/Cassette.toc | tr -d '\r[:space:]')
          if [ "$toc" != "${TAG#v}" ]; then
            echo "::error::Cassette.toc says version $toc but the release is $TAG"
            exit 1
          fi

      - name: Check the CurseForge key is set
        if: github.event_name == 'release'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          # Without it the packager skips the upload and the run still looks fine.
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::Add the CF_API_KEY secret (Settings > Secrets and variables > Actions), then re-run this job"
            exit 1
          fi

      - name: Changelog from the release's "What's new"
        if: github.event_name == 'release'
        env:
          NOTES: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          printf '%s\n' "$NOTES" | tr -d '\r' \
            | awk '/^#+ What.*s new/ { on = 1; next } on && /^#+ / { exit } on' > .changelog.md
          if ! grep -q '[^[:space:]]' .changelog.md; then
            printf 'See the release notes: %s\n' "$URL" > .changelog.md
          fi
          cat .changelog.md

      - name: Package (and upload, for a release)
        uses: BigWigsMods/packager@v2
        with:
          # -n: name the zip Cassette-v0.1.2.zip and the CurseForge file v0.1.2 (no "-forever")
          # -d: build only, no upload
          args: "-n {package-name}-{project-version}:{project-version} ${{ github.event_name != 'release' && '-d' || '' }}"
        env:
          CF_API_KEY: ${{ github.event_name == 'release' && secrets.CF_API_KEY || '' }}

      - name: Check CurseForge accepts the key (test runs only; reads, uploads nothing)
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::warning::No CF_API_KEY secret yet"
            exit 0
          fi
          code=$(curl -s -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' \
            -H "x-api-token: $CF_API_KEY" https://wow.curseforge.com/api/game/wow/versions)
          if [ "$code" != 200 ]; then
            echo "::error::CurseForge refused the key (HTTP $code)"
            exit 1
          fi
          echo "CurseForge accepts the key. Its WoW Forever game versions:"
          jq -r '.[] | select(.gameVersionTypeID == 88568) | "  \(.name)"' "$RUNNER_TEMP/versions.json"

      - uses: actions/upload-artifact@v7
        with:
          name: addon-zip
          path: .release/*.zip
          include-hidden-files: true # .release starts with a dot
